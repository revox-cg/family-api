services:

  family_api:
    container_name: family_api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://family_db:5432/${POSTGRES_DATABASE_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_DATABASE_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_DATABASE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    env_file:
      - .env
    networks:
      - family-network
    ports:
      - "7780:7777"
    depends_on:
      - family_db


  family_db:
    container_name: family_db
    image: postgres:17.4
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_DATABASE_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DATABASE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
    ports:
      - "9432:5432"
    networks:
      - family-network
    volumes:
      - ../../config/postgres/family/postgres_data:/var/lib/postgresql/data/

networks:
  family-network:
    driver: bridge